let activeCall=null,callStarted=0,callLoudspeaker=false,callMuted=false,callHeld=false,playerTickBase=0,playerElapsedBase=0,composeFocus=1,composeAttachment=0;
function startCall(number){if(!number)return;activeCall=number;callStarted=Date.now();callLoudspeaker=false;callMuted=false;callHeld=false;phoneState.calls.dialled.unshift({number,time:'Just now'});persist();page='incall';open=false;draw()}
function endCall(){if(activeCall){activeCall=null;notice='Call ended';history=[];page='home';draw()}}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function playerSeconds(){let p=phoneState.player,b=Number(p.elapsed)||0,e=p.playing?Math.min(180,b+(Date.now()-playerTickBase)/1000):b;if(e>=180&&p.playing){p.playing=false;p.elapsed=0;persist();return 0}return e}

function saveContact(){if(!contactName.trim()){notice='Enter a name';draw();return}let c={name:contactName.trim(),number:contactNumber.trim()||'(no number)'};if(editingContact)phoneState.contacts[contactIndex]=c;else{phoneState.contacts.push(c);contactIndex=phoneState.contacts.length-1}persist();editingContact=false;contactName='';contactNumber='';go('contact')}
