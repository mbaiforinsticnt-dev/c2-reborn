name: C2 native takeover test (no release)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: c2-native-takeover-test
  cancel-in-progress: false
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import frozen upstream without changing HTML or app source
        shell: bash
        run: |
          set -euo pipefail
          branch=android/takeover-v1.96.0
          before=$(git hash-object index.html)
          git clone --depth 1 --branch c2-native-v1.96.0 https://github.com/moshenuch/moshenuch.git /tmp/upstream
          test "$(git -C /tmp/upstream rev-parse HEAD)" = 030d33b0f1fc30f56054c8b03f37ac4c17d1cddf
          git switch -c "$branch"
          mkdir -p android
          cp -a /tmp/upstream/GPT-c2-from-reborn android/native
          cp /tmp/upstream/.github/workflows/build-GPT-c2-from-reborn.yml android/UPSTREAM-WORKFLOW.yml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('android/native')
          rows={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          Path('android/UPSTREAM.json').write_text(json.dumps({'repo':'https://github.com/moshenuch/moshenuch','tag':'c2-native-v1.96.0','commit':'030d33b0f1fc30f56054c8b03f37ac4c17d1cddf','files_sha256':rows},indent=2)+'\n')
          PY
          printf '%s\n' '# Native APK takeover baseline' '' 'Frozen import of moshenuch v1.96.0. Native source is unchanged.' 'HTML remains read-only. No release is published by this workflow.' 'Test CI applies a .takeovertest application-ID suffix and matching provider authority only in the build workspace.' 'Debug-signed for testing only; not production and not an upgrade to the upstream APK.' > android/README.md
          test "$(git hash-object index.html)" = "$before"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android
          git commit -m 'Import unchanged C2 native v1.96.0 baseline with provenance'
          git push origin "HEAD:refs/heads/$branch"
          echo "Baseline commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore exact pinned build assets
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 android/native/tools/create_swirl_wallpaper.py android/native/app/src/main/res/drawable/screen_wallpaper.png
          cp android/native/app/src/main/res/drawable/screen_wallpaper.png android/native/app/src/main/assets/nokia_wallpaper.png
          python3 android/native/tools/extract_selection_icons.py
          python3 android/native/tools/extract_nokia_fonts.py
      - name: Apply isolated test identity in build workspace only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/native/app/build.gradle')
          text=p.read_text().replace('applicationId "com.moshenuch.c2reborn"','applicationId "com.moshenuch.c2reborn.takeovertest"')
          assert 'applicationId "com.moshenuch.c2reborn.takeovertest"' in text
          p.write_text(text)
          for rel in ['app/src/main/AndroidManifest.xml','app/src/main/java/com/moshenuch/c2reborn/C2MediaProvider.java']:
              p=Path('android/native')/rel
              p.write_text(p.read_text().replace('com.moshenuch.c2reborn.privatefiles','com.moshenuch.c2reborn.takeovertest.privatefiles'))
          PY
      - name: Restore persistent test signing key
        env:
          KEYSTORE_B64: ${{ secrets.C2_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build test-signed APK
        working-directory: android/native
        run: gradle --no-daemon assembleDebug
      - name: Verify signature and retain hashes
        run: |
          set -euo pipefail
          apk=android/native/app/build/outputs/apk/debug/app-debug.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$apk" | tee android/test-signature.txt
          cp "$apk" android/C2-takeover-v1.96.0-test.apk
          sha256sum android/C2-takeover-v1.96.0-test.apk > android/test-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: C2-takeover-v1.96.0-test
          path: |
            android/C2-takeover-v1.96.0-test.apk
            android/test-signature.txt
            android/test-sha256.txt
            android/UPSTREAM.json
          if-no-files-found: error
          retention-days: 30
