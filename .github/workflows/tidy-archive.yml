name: Tidy root ZIPs into archive
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-zips:
    runs-on: ubuntu-latest
    steps:
      - name: Clone without blobs and move root ZIPs into archive/
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --no-checkout "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree HEAD
          moved=0
          while IFS=$'\t' read -r meta path; do
            case "$path" in
              *.zip|*.ZIP) ;;
              *) continue ;;
            esac
            case "$path" in
              */*) continue ;;
            esac
            sha=$(echo "$meta" | awk '{print $2}')
            if git ls-files --error-unmatch "archive/$path" >/dev/null 2>&1; then
              echo "skip, exists: $path"
              continue
            fi
            printf '100644 %s 0\t%s\n' "$sha" "archive/$path" | git update-index --add --index-info
            git update-index --force-remove "$path"
            moved=$((moved+1))
            echo "moved: $path -> archive/$path"
          done < <(git ls-files -s)
          echo "moved=$moved" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$moved" -eq 0 ]; then
            echo "Nothing to move"
            exit 0
          fi
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p HEAD -m "Move historical root ZIPs into archive/ (rename only, no content changes)")
          git push origin "$commit:refs/heads/main"
          echo "pushed commit $commit" | tee -a "$GITHUB_STEP_SUMMARY"
